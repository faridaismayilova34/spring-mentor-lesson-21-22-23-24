spring.application.name=spring-les-21

spring.datasource.url=jdbc:postgresql://localhost:5432/mentor
spring.datasource.username=postgres
spring.datasource.password=Feride
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

spring.jpa.generate-ddl=true

logging.level.com.example.conference=DEBUG

conference.report.rate-ms=30000
spring.task.scheduling.pool.size=2

#spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.change-log=classpath:liquibase/changelog-master.yaml